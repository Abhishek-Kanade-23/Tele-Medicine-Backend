name: Build & Deploy to ECR (Maven)

on:
  push:
    branches:
      - beta
  workflow_dispatch:

env:
  SERVICES: Api-Gateway-Service,Authentication-Service,Eureka-Registery-Service

jobs:
  build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push each service (Maven only)
        run: |
          IFS=',' read -ra SERVICES_ARR <<< "$SERVICES"

          for service in "${SERVICES_ARR[@]}"; do
            echo "============ Building $service ============"
            cd $service

            # Run Maven build
            mvn -q -DskipTests clean package

            # Prepare variables
            SERVICE_NAME=$(echo $service | tr '[:upper:]' '[:lower:]')
            REPO_NAME="telemedicine-$SERVICE_NAME"
            IMAGE_URI="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/$REPO_NAME:${{ github.sha }}"

            # Create ECR repo if not exists
            aws ecr describe-repositories --repository-names $REPO_NAME >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name $REPO_NAME

            # Build Docker image (context = service folder)
            docker build -t $REPO_NAME:${{ github.sha }} .

            # Tag & push
            docker tag $REPO_NAME:${{ github.sha }} $IMAGE_URI
            docker push $IMAGE_URI

            echo "Pushed: $IMAGE_URI"

            cd ..
          done
