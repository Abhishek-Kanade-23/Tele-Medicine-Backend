name: Build & Deploy to ECS (Maven)

on:
  push:
    branches:
      - beta
  workflow_dispatch:

env:
  SERVICES: Api-Gateway-Service,Authentication-Service,Eureka-Registery-Service
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: 471112677067
  CLUSTER_NAME: telemedicine-cluster

  # ECS service names (Corrected)
  API_GATEWAY_ECS_SERVICE: api-gateway-task-service-b17fkyzb
  AUTH_ECS_SERVICE: authentication-task-service-lvqt1sjh
  EUREKA_ECS_SERVICE: eureka-task-service-47g1l5m5

  # ECS task family names
  API_GATEWAY_TASK_FAMILY: api-gateway-task
  AUTH_TASK_FAMILY: authentication-task
  EUREKA_TASK_FAMILY: eureka-task

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Push Images & Deploy to ECS
        run: |
          IFS=',' read -ra SERVICES_ARR <<< "$SERVICES"

          for service in "${SERVICES_ARR[@]}"; do
            echo "============ Building $service ============"

            cd $service

            mvn -q -DskipTests clean package

            SERVICE_NAME=$(echo $service | tr '[:upper:]' '[:lower:]')
            REPO_NAME="telemedicine-$SERVICE_NAME"
            IMAGE_TAG="${{ github.sha }}"
            IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${REPO_NAME}:${IMAGE_TAG}"

            # Create repo if not exists
            aws ecr describe-repositories --repository-names $REPO_NAME >/dev/null 2>&1 || \
               aws ecr create-repository --repository-name $REPO_NAME

            docker build -t $REPO_NAME:${IMAGE_TAG} .
            docker tag $REPO_NAME:${IMAGE_TAG} $IMAGE_URI
            docker push $IMAGE_URI

            echo "Pushed Image: $IMAGE_URI"

            cd ..

            echo "============ Updating ECS Service ============"

            # Map service -> task family
            if [ "$service" == "Api-Gateway-Service" ]; then
              ECS_SERVICE=$API_GATEWAY_ECS_SERVICE
              TASK_FAMILY=$API_GATEWAY_TASK_FAMILY
            elif [ "$service" == "Authentication-Service" ]; then
              ECS_SERVICE=$AUTH_ECS_SERVICE
              TASK_FAMILY=$AUTH_TASK_FAMILY
            elif [ "$service" == "Eureka-Registery-Service" ]; then
              ECS_SERVICE=$EUREKA_ECS_SERVICE
              TASK_FAMILY=$EUREKA_TASK_FAMILY
            fi

            echo "Deploying to ECS Service: $ECS_SERVICE"

            # Get current task definition JSON
            TASK_JSON=$(aws ecs describe-task-definition --task-definition $TASK_FAMILY)

            # Extract only taskDefinition section
            TASK_DEF=$(echo "$TASK_JSON" | jq '.taskDefinition')

            # Update only the container image
            NEW_TASK_DEF=$(echo "$TASK_DEF" | jq --arg IMAGE "$IMAGE_URI" '
              .containerDefinitions = (.containerDefinitions | map(.image = $IMAGE))
            ')

            # Register new task revision
            NEW_TASK_DEF_ARN=$(echo "$NEW_TASK_DEF" | \
              aws ecs register-task-definition --cli-input-json file:///dev/stdin | \
              jq -r '.taskDefinition.taskDefinitionArn')

            echo "New Task Definition ARN: $NEW_TASK_DEF_ARN"

            # Update ECS service to use new revision
            aws ecs update-service \
              --cluster $CLUSTER_NAME \
              --service $ECS_SERVICE \
              --task-definition $NEW_TASK_DEF_ARN

            echo "Updated ECS service $ECS_SERVICE → $NEW_TASK_DEF_ARN"

          done
