name: Build & Push to ECR (Maven)

on:
  push:
    branches:
      - beta
  workflow_dispatch:

env:
  SERVICES: Api-Gateway-Service,Authentication-Service,Eureka-Registery-Service
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: 471112677067

jobs:
  build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Docker Images
        run: |
          IFS=',' read -ra SERVICES_ARR <<< "$SERVICES"

          for service in "${SERVICES_ARR[@]}"; do
            echo "============ Building $service ============"
            cd $service

            mvn -q -DskipTests clean package

            SERVICE_NAME=$(echo $service | tr '[:upper:]' '[:lower:]')
            REPO_NAME="telemedicine-$SERVICE_NAME"

            # ALWAYS PUSH TO "latest" TAG
            IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${REPO_NAME}:latest"

            aws ecr describe-repositories --repository-names $REPO_NAME >/dev/null 2>&1 || \
              aws ecr create-repository --repository-name $REPO_NAME

            docker build -t $REPO_NAME:latest .
            docker tag $REPO_NAME:latest $IMAGE_URI
            docker push $IMAGE_URI

            echo "Pushed Image: $IMAGE_URI"

            cd ..
          done
